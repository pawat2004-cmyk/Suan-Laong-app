<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#166534"><link rel="manifest" href="manifest.json"><title>สวนละออง</title><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:#f4f7f5;color:#17201b}header{background:#166534;color:#fff;padding:18px}main{max-width:760px;margin:auto;padding:14px 14px 90px}.card{background:#fff;padding:14px;border-radius:16px;margin:10px 0;box-shadow:0 2px 10px #0001}input,button,textarea{font:inherit;width:100%;padding:12px;border-radius:12px;border:1px solid #ccd8d0;margin:5px 0}button{background:#166534;color:#fff;border:0;font-weight:700}.item{border:1px solid #e1e8e3;border-radius:12px;padding:12px;margin:8px 0}.muted{color:#68766d;font-size:13px}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.pill{display:inline-block;background:#edf7f0;color:#166534;border-radius:999px;padding:3px 8px;font-size:12px}dialog{border:0;border-radius:18px;width:94%;max-width:600px;padding:16px}nav{position:fixed;bottom:0;left:0;right:0;background:#fff;padding:8px;display:flex;border-top:1px solid #ddd}nav button{background:#fff;color:#166534}
</style></head><body><header><b style="font-size:21px">สวนละออง</b><div>ระบบข้อมูลลูกบ้าน · พานทอง ชลบุรี</div></header><main>
<div class="row"><div class="card"><div class="muted">จำนวนรายการ</div><b id="count" style="font-size:26px">0</b></div><div class="card"><div class="muted">ยอดค้างรวม</div><b id="debt" style="font-size:26px">0</b></div></div>
<div class="card"><input id="search" placeholder="ค้นหาบ้านเลขที่ ชื่อ หรือเบอร์โทร" oninput="render()"><button onclick="add()">+ เพิ่มลูกบ้าน</button></div><div id="list"></div>
<div class="card"><b>นำข้อมูลจากระบบเดิมมาใช้</b><div class="muted">หากมีไฟล์สำรอง JSON จากแอปเดิม สามารถนำเข้าที่นี่ได้ ข้อมูลจะเก็บในเครื่องมือถือ</div><input type="file" id="file" accept=".json"><button onclick="restore()">นำเข้าข้อมูลสำรอง</button><button onclick="backup()">สำรองข้อมูล</button></div>
</main><dialog id="dlg"><h3>ข้อมูลลูกบ้าน</h3><input id="id" type="hidden"><label>บ้านเลขที่/ตำแหน่ง</label><input id="house"><label>ชื่อ</label><input id="name"><label>เบอร์โทร</label><input id="phone"><div class="row"><div><label>มิเตอร์น้ำล่าสุด</label><input id="water" type="number"></div><div><label>มิเตอร์ไฟล่าสุด</label><input id="electric" type="number"></div></div><div class="row"><div><label>ค้างค่าน้ำ</label><input id="wd" type="number"></div><div><label>ค้างค่าไฟ</label><input id="ed" type="number"></div></div><label>ค้างค่าขยะ</label><input id="td" type="number"><label>หมายเหตุ</label><textarea id="note"></textarea><button onclick="saveHome()">บันทึก</button><button style="background:#e8f2eb;color:#166534" onclick="dlg.close()">ปิด</button></dialog>
<script>
const K='suanlaong_app_v1';let db=JSON.parse(localStorage.getItem(K)||'null')||{homes:[],settings:{waterRate:29,electricRate:7.3,trashRate:20}};const $=x=>document.querySelector(x);function sv(){localStorage.setItem(K,JSON.stringify(db));render()}function debt(h){return +(h.waterDebt||0)+ +(h.electricDebt||0)+ +(h.trashDebt||0)+(h.records||[]).filter(r=>!r.paid).reduce((a,r)=>a+ +(r.total||0),0)}function render(){let t=$('#search').value.toLowerCase();let a=db.homes.filter(h=>(String(h.house)+' '+String(h.name)+' '+String(h.phone)).toLowerCase().includes(t));$('#count').textContent=db.homes.length;$('#debt').textContent=db.homes.reduce((a,h)=>a+debt(h),0).toLocaleString('th-TH');$('#list').innerHTML=a.map(h=>'<div class="item" onclick="edit('+h.id+')"><b>'+esc(h.house||'ไม่ระบุบ้านเลขที่')+'</b><div>'+esc(h.name||'ยังไม่มีชื่อ')+'</div><div class="muted">'+esc(h.phone||'ไม่มีเบอร์')+' · <span class="pill">ค้าง '+debt(h).toLocaleString('th-TH')+' บาท</span></div></div>').join('')}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function add(){let id=Math.max(0,...db.homes.map(x=>+x.id||0))+1;db.homes.push({id,house:'',name:'',phone:'',waterStart:0,electricStart:0,waterDebt:0,electricDebt:0,trashDebt:0,note:'',records:[]});sv();edit(id)}function edit(id){let h=db.homes.find(x=>+x.id===+id);$('#id').value=id;$('#house').value=h.house||'';$('#name').value=h.name||'';$('#phone').value=h.phone||'';$('#water').value=h.waterStart||0;$('#electric').value=h.electricStart||0;$('#wd').value=h.waterDebt||0;$('#ed').value=h.electricDebt||0;$('#td').value=h.trashDebt||0;$('#note').value=h.note||'';dlg.showModal()}function saveHome(){let h=db.homes.find(x=>+x.id===+$('#id').value);Object.assign(h,{house:$('#house').value,name:$('#name').value,phone:$('#phone').value,waterStart:+$('#water').value||0,electricStart:+$('#electric').value||0,waterDebt:+$('#wd').value||0,electricDebt:+$('#ed').value||0,trashDebt:+$('#td').value||0,note:$('#note').value});sv();dlg.close()}function backup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.download='สวนละออง_backup.json';a.click()}function restore(){let f=$('#file').files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{db=JSON.parse(r.result);sv();alert('นำเข้าข้อมูลเรียบร้อย')}catch(e){alert('ไฟล์ไม่ถูกต้อง')}};r.readAsText(f)}render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js');
</script></body></html>
